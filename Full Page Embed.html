        /* -------------------------------------------------------------
         * GEOLOCATION &amp; PROXIMITY
         * ------------------------------------------------------------- */
        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return (R * c).toFixed(1);
        }

        function initGeoLocation() {
            const bannerText = document.getElementById('geo-banner-text');
            const drawerLocText = document.getElementById('drawer-location-status');

            if (!navigator.geolocation) {
                if(bannerText) bannerText.innerText = &quot;Geolocation not supported. Showing regional default facilities.&quot;;
                return;
            }

            if(bannerText) bannerText.innerText = &quot;Connecting GPS...&quot;;
            if(drawerLocText) drawerLocText.innerText = &quot;Locating GPS...&quot;;

            navigator.geolocation.getCurrentPosition(
                (pos) =&gt; {
                    userLocation.lat = pos.coords.latitude;
                    userLocation.lng = pos.coords.longitude;

                    if(bannerText) bannerText.innerText = `GPS Sync: Lat ${userLocation.lat.toFixed(4)}, Lng ${userLocation.lng.toFixed(4)}. Distances dynamically updated!`;
                    if(drawerLocText) drawerLocText.innerText = `GPS: ${userLocation.lat.toFixed(3)}, ${userLocation.lng.toFixed(3)}`;

                    renderHospitals();
                    renderWellnessProviders();
                },
                (err) =&gt; {
                    if(bannerText) bannerText.innerText = &quot;Location access denied. Displaying regional defaults.&quot;;
                    if(drawerLocText) drawerLocText.innerText = &quot;Default Location&quot;;
                    renderHospitals();
                    renderWellnessProviders();
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        /* -------------------------------------------------------------
         * SOS EMERGENCY FIX
         * ------------------------------------------------------------- */
        function triggerEmergencySOS() {
            const modal = document.getElementById('sos-modal');
            const coordsTxt = document.getElementById('sos-coords-text');
            modal.classList.remove('hidden');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) =&gt; {
                    userLocation.lat = pos.coords.latitude;
                    userLocation.lng = pos.coords.longitude;
                    coordsTxt.innerText = `Lat: ${userLocation.lat.toFixed(5)}, Lng: ${userLocation.lng.toFixed(5)}`;
                }, () =&gt; {
                    coordsTxt.innerText = `Lat: ${userLocation.lat.toFixed(4)}, Lng: ${userLocation.lng.toFixed(4)} (Approximate GPS)`;
                });
            } else {

        function handleForumPostSubmit(e) {
            e.preventDefault();
            const author = document.getElementById('forum-author').value.trim();
            const badge = document.getElementById('forum-badge').value;
            const content = document.getElementById('forum-content').value.trim();

            let posts = JSON.parse(localStorage.getItem('jannani_forum_posts')) || defaultForumPosts;
            const newPost = {
                id: Date.now(),
                author: author || &quot;Mother&quot;,
                badge: badge,
                timestamp: &quot;Just now&quot;,
                content: content,
                likes: 0,
                replies: []
            };

            posts.unshift(newPost);
            localStorage.setItem('jannani_forum_posts', JSON.stringify(posts));
            document.getElementById('forum-content').value = '';
            renderForumFeed(posts);
        }

        function handleReplySubmit(e, postId) {
            e.preventDefault();
            const input = e.target.querySelector('input');
            const replyText = input.value.trim();
            if(!replyText) return;

            let posts = JSON.parse(localStorage.getItem('jannani_forum_posts')) || defaultForumPosts;
            const post = posts.find(p =&gt; p.id === postId);
            if (post) {
                const authorName = currentUser ? currentUser.name : &quot;Experienced Mother&quot;;
                const badgeLabel = currentUser ? currentUser.trimester : &quot;Experienced Mother&quot;;
                post.replies.push({ author: authorName, badge: badgeLabel, text: replyText });
                localStorage.setItem('jannani_forum_posts', JSON.stringify(posts));
                renderForumFeed(posts);
            }
        }

        function upvotePost(postId) {
            let posts = JSON.parse(localStorage.getItem('jannani_forum_posts')) || defaultForumPosts;
            const post = posts.find(p =&gt; p.id === postId);
            if (post) {
                post.likes += 1;
                localStorage.setItem('jannani_forum_posts', JSON.stringify(posts));
                renderForumFeed(posts);
            }
        }

        /* -------------------------------------------------------------
         * AUTHENTICATION SYSTEM WITH INLINE ERROR VALIDATION
         * ------------------------------------------------------------- */
        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
            hideAuthError();
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
            hideAuthError();
        }

        function showAuthError(msg) {
            const box = document.getElementById('auth-error-box');
            document.getElementById('auth-error-msg').innerText = msg;
            box.classList.remove('hidden');
        }

        function hideAuthError() {
            document.getElementById('auth-error-box').classList.add('hidden');
        }

        function toggleAuthMode() {
            hideAuthError();
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? &quot;Create New Account&quot; : &quot;Account Access&quot;;
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? &quot;Sign Up &amp; Register&quot; : &quot;Log In&quot;;
            document.getElementById('auth-switch-btn').innerText = isSignUpMode ? &quot;Already registered? Click to Log In&quot; : &quot;Don't have an account? Click to Register / Sign Up&quot;;
            document.getElementById('field-name').classList.toggle('hidden', !isSignUpMode);
            document.getElementById('field-trimester').classList.toggle('hidden', !isSignUpMode);
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            hideAuthError();

            const email = document.getElementById('input-email').value.trim().toLowerCase();
            const password = document.getElementById('input-password').value;
            let registeredUsers = JSON.parse(localStorage.getItem('jannani_registered_accounts')) || [];

            if (isSignUpMode) {
                const name = document.getElementById('input-name').value.trim() || &quot;Expecting Mother&quot;;
                const trimester = document.getElementById('input-trimester').value;

                if (registeredUsers.some(u =&gt; u.email === email)) {
                    showAuthError(&quot;An account with this email already exists. Please Log In.&quot;);
                    return;
                }

                const newUser = { email, password, name, trimester };
                registeredUsers.push(newUser);
                localStorage.setItem('jannani_registered_accounts', JSON.stringify(registeredUsers));

                currentUser = newUser;
                localStorage.setItem('jannani_user', JSON.stringify(currentUser));
                renderAuthHeader();
                closeAuthModal();
                alert(`Welcome, ${newUser.name}! Your account has been registered.`);
            } else {
                // AUTH LOGIN VALIDATION THROW ERROR
                const match = registeredUsers.find(u =&gt; u.email === email &amp;&amp; u.password === password);
                if (!match) {
                    showAuthError(&quot;Account not found or password incorrect. Please check credentials or Sign Up.&quot;);
                    return;
                }

                currentUser = match;
                localStorage.setItem('jannani_user', JSON.stringify(currentUser));
                renderAuthHeader();
                closeAuthModal();
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('jannani_user');
            renderAuthHeader();
        }

        function renderAuthHeader() {
            const container = document.getElementById('auth-header-btn');
            if (currentUser) {
                container.innerHTML = `
                    &lt;div class=&quot;flex items-center gap-2&quot;&gt;
                        &lt;div class=&quot;w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 text-white font-bold flex items-center justify-center text-xs shadow-sm&quot;&gt;
                            ${currentUser.name.charAt(0).toUpperCase()}
                        &lt;/div&gt;
                        &lt;button onclick=&quot;handleLogout()&quot; class=&quot;text-xs text-rose-700 hover:text-rose-900 font-semibold underline&quot;&gt;
                            Exit
                        &lt;/button&gt;
                    &lt;/div&gt;
                `;
            } else {
                container.innerHTML = `
                    &lt;button onclick=&quot;openAuthModal()&quot; class=&quot;px-3 py-2 rounded-xl bg-rose-100 text-rose-700 hover:bg-rose-200 transition font-semibold text-xs flex items-center gap-1.5&quot;&gt;
                        &lt;i class=&quot;fa-regular fa-user&quot;&gt;&lt;/i&gt; Sign In
                    &lt;/button&gt;
                `;
            }
        }

         * ------------------------------------------------------------- */
        function toggleChatbot(forceOpen) {
            const chatWin = document.getElementById('chat-window');
            if (forceOpen === true) chatWin.classList.remove('hidden');
            else if (forceOpen === false) chatWin.classList.add('hidden');
            else chatWin.classList.toggle('hidden');
        }

        function openChatbot(query) {
            toggleChatbot(true);
            if(query) sendQuickReply(query);
        }

        function sendQuickReply(txt) {
            document.getElementById('chat-input').value = txt;
            handleChatSubmit(new Event('submit'));
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const query = input.value.trim();
            if (!query) return;

            appendChatMessage('user', query);
            input.value = '';

            setTimeout(() =&gt; {
                const response = getAIResponse(query);
                appendChatMessage('ai', response);
            }, 600);
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = &quot;flex gap-2&quot;;

            if (sender === 'user') {
                div.innerHTML = `
                    &lt;div class=&quot;ml-auto bg-gradient-to-r from-rose-500 to-pink-500 text-white p-3 rounded-2xl rounded-tr-none text-xs shadow-sm max-w-[85%] leading-relaxed&quot;&gt;
                        ${text}
                    &lt;/div&gt;
                `;

                return &quot;Prenatal yoga improves pelvic flexibility and relieves back pain. Check our 'Yoga &amp; Diet' section for trimester workout videos!&quot;;
            }
            if (q.includes('diet') || q.includes('food') || q.includes('eat')) {
                return &quot;Prioritize folic acid (spinach, lentils), iron, calcium, and good hydration. Avoid unpasteurized dairy and raw meats.&quot;;

            if (q.includes('emergency') || q.includes('bleeding') || q.includes('pain') || q.includes('sos')) {
                return &quot;🚨 If you experience severe abdominal pain or bleeding, tap the red SOS Emergency button at the top right immediately.&quot;;
            }
            return `Regarding &quot;${query}&quot;, I recommend checking our curated Trimester guides or consulting your obstetrician.`;
